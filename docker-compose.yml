services:
  db:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: dancehub
      POSTGRES_USER: dancehub
      POSTGRES_PASSWORD: dancehub
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dancehub -d dancehub"]
      interval: 2s
      timeout: 5s
      retries: 15

  backend:
    build:
      context: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg://dancehub:dancehub@db:5432/dancehub
      CORS_ORIGINS: http://localhost:5173
      OPERATOR_SECRET: ${OPERATOR_SECRET:-}
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"

  frontend:
    build:
      context: ./frontend
    environment:
      VITE_API_URL: http://localhost:8000
    depends_on:
      - backend
    ports:
      - "5173:5173"

volumes:
  postgres_data:
