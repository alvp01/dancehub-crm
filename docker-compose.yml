services:
  db:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: dancehub
      POSTGRES_USER: dancehub
      POSTGRES_PASSWORD: dancehub
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dancehub -d dancehub"]
      interval: 2s
      timeout: 5s
      retries: 15

  backend:
    build:
      context: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg://dancehub:dancehub@db:5432/dancehub
      DATABASE_POOL_SIZE: ${DATABASE_POOL_SIZE:-5}
      DATABASE_MAX_OVERFLOW: ${DATABASE_MAX_OVERFLOW:-10}
      DATABASE_POOL_TIMEOUT_SECONDS: ${DATABASE_POOL_TIMEOUT_SECONDS:-30}
      DATABASE_POOL_RECYCLE_SECONDS: ${DATABASE_POOL_RECYCLE_SECONDS:-1800}
      DATABASE_RETRY_INITIAL_SECONDS: ${DATABASE_RETRY_INITIAL_SECONDS:-1}
      DATABASE_RETRY_MAX_SECONDS: ${DATABASE_RETRY_MAX_SECONDS:-30}
      DATABASE_HEALTH_CHECK_INTERVAL_SECONDS: ${DATABASE_HEALTH_CHECK_INTERVAL_SECONDS:-10}
      CORS_ORIGINS: http://localhost:5173
      OPERATOR_SECRET: ${OPERATOR_SECRET:-}
      JWT_SECRET: ${JWT_SECRET:-}
    depends_on:
      db:
        condition: service_started
    ports:
      - "8000:8000"

  frontend:
    build:
      context: ./frontend
    environment:
      VITE_API_URL: http://localhost:8000
    depends_on:
      - backend
    ports:
      - "5173:5173"

volumes:
  postgres_data:
